  const chart = rated.length >= 2 ? Chart.line([{ data: rated.map(x => num(x.rating)), color: 'var(--accent, var(--acc))' }], { labels: rated.map(x => fmtDate(x.m.date).slice(5)), h: 140, min: Math.max(0, Math.floor(Math.min(...rated.map(x => num(x.rating)))) - 1), max: 10 }) : '';
  return `<div style="display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;align-items:center"><div><small style="opacity:.7">平均評価</small><div style="font-size:24px;font-weight:900">${avg != null ? avg.toFixed(2) : '—'}</div></div><div><small style="opacity:.7">出場</small><div style="font-size:24px;font-weight:900">${log.length}</div></div><div><small style="opacity:.7">MOM</small><div style="font-size:24px;font-weight:900">${log.filter(x => x.motm).length}</div></div></div>${chart ? `<div style="padding:0 10px">${chart}</div>` : ''}
    <div style="overflow-x:auto"><table class="${cls}"><thead><tr><th>日付</th><th>対戦</th><th>結果</th><th>出場</th><th>G</th><th>A</th><th>評価</th></tr></thead><tbody>${log.slice().reverse().map(x => { const r = resultOf(x.m), [f, ag] = gfga(x.m); return `<tr style="cursor:pointer" onclick="location.hash='${link(x.m).replace(/^#/, '')}'"><td>${fmtDate(x.m.date).slice(5)}</td><td>${x.m.homeId === own() ? 'vs' : '@'} ${esc(teamName(oppOf(x.m)))}</td><td><span class="res ${r} ${r}" style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:#fff;font-size:10px;font-weight:800">${r}</span> ${f}-${ag}</td><td>${x.min}'${x.started ? '' : ' <small style="opacity:.6">途中</small>'}</td><td>${x.g || ''}</td><td>${x.a || ''}</td><td>${rtBadge(x.rating)}${x.motm ? ' ⭐' : ''}${x.y ? ' 🟨' : ''}${x.r ? ' 🟥' : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}

/** "60M" "6000万" "1.2億" "500k" "€60,000,000" → number */
function parseMoney(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[,\s￥¥£€$]/g, '').replace(/円|ポンド|ユーロ|ドル/g, '');
  if (!s) return '';
  let total = 0, m;
  const oku = s.match(/^([\d.]+)億/); if (oku) { total += parseFloat(oku[1]) * 1e8; s = s.slice(oku[0].length); }
  const man = s.match(/^([\d.]+)万/); if (man) { total += parseFloat(man[1]) * 1e4; s = s.slice(man[0].length); }
  if ((m = s.match(/^([\d.]+)\s*(bn|b|m|k)?$/i))) total += parseFloat(m[1]) * ({ bn: 1e9, b: 1e9, m: 1e6, k: 1e3 }[(m[2] || '').toLowerCase()] || 1);
  else if (s) total += num(s);
  return Math.round(total);
}

      const top = k => Object.values(ps).filter(x => x[k] && playerById(x.pid)).sort(by(x => x[k], -1)).slice(0, 5);
      const list = (k, u) => top(k).map((x, i) => `<a class="s-rank" href="${this.link('/player/' + x.pid)}"><span class="i">${i + 1}</span>${this.av(playerById(x.pid))}<b>${esc(pname(x.pid))}</b><div class="v">${x[k]}${u}</div></a>`).join('') || '<div class="s-empty">データなし</div>';
      const xi = c.bestXI, xs = formationSlots(xi?.formation || '4-3-3');
      return `${this.sh('CLUB RECORDS', 'クラブ史')}<p style="color:var(--muted);margin-top:-6px">積み重ねたシーズンが、クラブの歴史になる。</p>
        <div class="s-grid s-g3" style="margin:18px 0 26px">${[['シーズン', seasons.length], ['試合', ms.length], ['タイトル', sum(c.trophies, t => t.seasons.length)]].map(([k, v]) => `<div class="s-card s-kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>
        <section class="s-sec"><h3>PLAYER RECORDS</h3><div class="s-grid s-g3"><div><small style="color:var(--muted)">歴代出場</small><div class="s-card">${list('apps', '')}</div></div><div><small style="color:var(--muted)">歴代得点</small><div class="s-card">${list('g', 'G')}</div></div><div><small style="color:var(--muted)">歴代アシスト</small><div class="s-card">${list('a', 'A')}</div></div></div></section>
        <section class="s-sec"><h3>SEASON RECORDS</h3><div class="s-card s-scroll"><table class="s-tbl"><thead><tr><th>シーズン</th><th>成績</th><th>勝</th><th>分</th><th>負</th><th>得点</th><th>失点</th></tr></thead><tbody>${seasons.map(s => { const r = teamRecord(ms.filter(m => m.season === s)); const lg = c.competitions.find(k => k.season === s && k.format === 'league' && k.teamIds?.includes(own())); const rk = lg && standings(lg).find(x => x.id === own())?.rank; return `<tr><td>${s}</td><td>${rk ? `${esc(lg.name)} ${rk}位` : '—'} ${c.trophies.filter(t => t.seasons.includes(s)).map(t => t.icon || '🏆').join('')}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td></tr>`; }).join('') || '<tr><td colspan="7">データなし</td></tr>'}</tbody></table></div></section>
        ${xi && Object.values(xi.slots || {}).some(Boolean) ? `<section class="s-sec"><h3>ALL-TIME XI</h3><div style="max-width:520px"><div class="s-pitch">${xs.map(s => { const p = playerById(xi.slots[s.key]); return p ? `<a class="p" href="${this.link('/player/' + p.id)}" style="left:${s.x}%;top:${s.y * .92 + 4}%"><i>${src(p.photo) ? `<img src="${esc(src(p.photo))}">` : esc(p.number ?? '')}</i><b>${esc(shortNameS(p.name))}</b></a>` : ''; }).join('')}</div></div></section>` : ''}
        <a class="s-btn" href="${this.link('/trophies')}">トロフィールームへ →</a>`;
    },
  },
  scoreBox(m, big) {
    const evs = (m.events || []).filter(e => ['goal', 'pen', 'og'].includes(e.type)).sort(by(e => num(e.minute)));
    const forHome = e => e.type === 'og' ? e.teamId !== m.homeId : e.teamId === m.homeId;
    return `<div style="text-align:center;padding-top:18px;font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:700">${esc(compLabel(m).toUpperCase())} ${roundLabel(m) ? '・ ' + esc(roundLabel(m)) : ''}<br>${fmtDate(m.date, { wd: true })} ${esc(m.time || '')} ・ ${isDone(m) ? '試合終了' : '試合前'}</div>
      <div class="s-score"><div class="t">${big ? this.tlink(m.homeId, `<span style="display:flex;flex-direction:column;align-items:center;gap:10px">${this.crest(teamById(m.homeId), 'lg')}${esc(teamName(m.homeId))}</span>`) : `${this.crest(teamById(m.homeId))}${esc(teamName(m.homeId))}`}</div><div class="n">${isDone(m) ? `${m.hs} - ${m.as}` : 'VS'}${m.pk?.h !== '' && m.pk?.h != null && isDone(m) ? `<div style="font-size:14px;color:var(--muted)">PK ${m.pk.h}-${m.pk.a}</div>` : ''}</div><div class="t">${big ? this.tlink(m.awayId, `<span style="display:flex;flex-direction:column;align-items:center;gap:10px">${this.crest(teamById(m.awayId), 'lg')}${esc(teamName(m.awayId))}</span>`) : `${this.crest(teamById(m.awayId))}${esc(teamName(m.awayId))}`}</div></div>
      ${evs.length ? `<div class="s-scorers"><div>${evs.filter(forHome).map(e => `${e.minute}' ${esc(evName(e))}${e.type === 'og' ? ' (OG)' : e.type === 'pen' ? ' (PK)' : ''}`).join('<br>')}</div><div>${evs.filter(e => !forHome(e)).map(e => `${e.minute}' ${esc(evName(e))}${e.type === 'og' ? ' (OG)' : e.type === 'pen' ? ' (PK)' : ''}`).join('<br>')}</div></div>` : ''}`;
  },
};
const STAT_KEYS_S = [['possession', 'ポゼッション'], ['shots', 'シュート'], ['sot', '枠内シュート'], ['xg', 'xG'], ['passes', 'パス'], ['passAcc', 'パス成功率'], ['tackles', 'タックル'], ['corners', 'コーナーキック'], ['fouls', 'ファウル'], ['offsides', 'オフサイド'], ['saves', 'セーブ']];
const EV_S = { goal: '⚽', pen: '⚽', og: '⚽', yellow: '🟨', red: '🟥', sub: '🔁', pkmiss: '❌' };
const shortNameS = n => { if (String(n || '').length <= 12) return n; const s = String(n || '').trim().split(/\s+/); return s.length > 1 && s.at(-1).length > 2 ? s.at(-1) : s.join(' '); };
function lum(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; }
/* season awards (shared by admin + public site) */
const Awards = {
  score(s, p) { return (s.avg ? (s.avg - 6) * s.apps * 1.5 : 0) + s.g * 3 + s.a * 2 + s.motm * 2 + ((p?.pos === 'GK' || p?.pos === 'DF') ? s.cs * 1.5 : 0) + s.apps * .3; },
  compute(season) {
    const ms = matchesFor({ season, done: true }), S = playerStats({ ms }), n = ms.length;
    const rows = Object.values(S).map(s => ({ ...s, p: playerById(s.pid) })).filter(x => x.p);
    rows.forEach(x => x.sc = this.score(x, x.p));
    const regular = rows.filter(x => x.apps >= Math.max(1, n / 3));
    const top = (list, f) => list.slice().sort((a, b) => f(b) - f(a))[0] || null;
    const ageAt = p => p.birth ? ageOf(p.birth, `${parseInt(season)}-08-01`) : null;
    const ov = C().awards?.[season] || {};
    const pick = (k, auto) => ov[k] ? rows.find(x => x.pid === ov[k]) || { pid: ov[k], p: playerById(ov[k]), sc: 0 } : auto;
    const res = {
      mvp: pick('mvp', top(regular.length ? regular : rows, x => x.sc)),
      scorer: pick('scorer', top(rows.filter(x => x.g), x => x.g * 1000 - x.min / 100)),
      assist: pick('assist', top(rows.filter(x => x.a), x => x.a * 1000 - x.min / 100)),
      young: pick('young', top(rows.filter(x => { const a = ageAt(x.p); return a != null && a <= 21; }), x => x.sc)),
      gk: pick('gk', top(rows.filter(x => x.p.pos === 'GK'), x => x.cs * 10 + (x.avg || 0))),
    };
    const need = { GK: 1, DF: 4, MF: 3, FW: 3 }, xi = [];
    for (const [pos, k] of Object.entries(need)) rows.filter(x => x.p.pos === pos).sort((a, b) => b.sc - a.sc).slice(0, k).forEach(x => xi.push(x));
    res.xi = xi; res.matches = n; res.rec = teamRecord(ms);
    return res;
  },
  LABELS: { mvp: ['🏆', '年間MVP'], scorer: ['⚽', '得点王'], assist: ['🎯', 'アシスト王'], young: ['🌟', '最優秀若手選手'], gk: ['🧤', '最優秀GK'] },
  line(k, x) { if (!x) return '該当者なし'; return { scorer: `${x.g}ゴール`, assist: `${x.a}アシスト`, gk: `${x.cs ?? 0}クリーンシート` }[k] || `${x.apps ?? 0}試合 ${x.g ?? 0}G ${x.a ?? 0}A${x.avg ? ` 平均${x.avg.toFixed(2)}` : ''}`; },
  article(season) {
    const r = this.compute(season);
    const body = [`${season}シーズンのクラブ表彰を発表します。`, '', ...Object.entries(this.LABELS).filter(([k]) => r[k]).map(([k, [i, l]]) => `## ${i} ${l}\n**${pname(r[k].pid)}**（${this.line(k, r[k])}）`), '', `## シーズンベストイレブン\n${r.xi.map(x => `- ${x.p.pos} ${x.p.name}`).join('\n')}`, '', `チーム成績: ${r.rec.w}勝${r.rec.d}分${r.rec.l}敗（得点${r.rec.gf} 失点${r.rec.ga}）`].join('\n');
    return { title: `${season}シーズン クラブ表彰 — 年間MVPは${r.mvp ? pname(r.mvp.pid) : '—'}`, body };
  },
};/* boot when running as an exported standalone site */
if (window.__SITE_DATA__) {
  DB = window.__SITE_DATA__.db; Object.assign(IMG, window.__SITE_DATA__.images || {});
  const run = () => Site.mount(document.body, location.hash.slice(1) || '/', { base: '#', preview: window.__SITE_DATA__.preview });
  addEventListener('hashchange', run); addEventListener('DOMContentLoaded', run); if (document.readyState !== 'loading') run();
}
