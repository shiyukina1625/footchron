<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FootChron">
<link rel="apple-touch-icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='22' fill='%230a1120'/&gt;&lt;text x='50' y='68' font-size='58' text-anchor='middle'&gt;⚽&lt;/text&gt;&lt;/svg&gt;">
<title>FootChron Local</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;⚽&lt;/text&gt;&lt;/svg&gt;">
<style id="css-admin">:root{
  --bg:#0a1120;--panel:#101a2d;--panel2:#15213a;--panel3:#1b2944;--line:#22314f;--line2:#2c3d60;
  --text:#e7edf8;--muted:#8b9bbb;--faint:#5f6f91;
  --accent:#22c55e;--accent-ink:#04230f;--blue:#3b82f6;--danger:#ef4444;--warn:#f59e0b;--gold:#eab308;
  --win:#22c55e;--draw:#94a3b8;--loss:#ef4444;
  --radius:12px;--shadow:0 10px 30px rgba(0,0,0,.35);
  --sb:248px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f6f8fc;--panel3:#eef2f8;--line:#e2e7f0;--line2:#d3dae7;
  --text:#111827;--muted:#5b6780;--faint:#9aa5bb;--accent:#16a34a;--accent-ink:#fff;
  --shadow:0 10px 30px rgba(15,23,42,.12);color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Hiragino Sans","Noto Sans JP","Yu Gothic UI","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
svg:not([width]){width:16px;height:16px;flex:none;vertical-align:-3px}
.card h3 svg{color:var(--accent)}
svg.chart,svg.radar{width:100%;height:auto}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.mono{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px 20px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--panel3);display:grid;place-items:center;overflow:hidden;font-weight:800;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.brand small{color:var(--muted);font-size:11px}
.nav-h{font-size:11px;color:var(--faint);letter-spacing:.08em;padding:12px 10px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
.nav a.on svg{color:var(--accent)}
.nav a svg{width:17px;height:17px;flex:none}
.nav a .kbd{margin-left:auto}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1}
.search-btn{display:flex;align-items:center;gap:8px;min-width:220px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--faint);cursor:pointer}
.search-btn:hover{border-color:var(--line2)}
.save-st{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-st i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.save-st.busy i{background:var(--warn)}
.content{padding:22px;max-width:1280px;width:100%;margin:0 auto}
.menu-btn{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .menu-btn{display:inline-flex}
  .search-btn{min-width:0}
  .search-btn span{display:none}
  .content{padding:16px}
  .topbar{padding:8px 12px}
  .hide-sm{display:none!important}
}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:22px;letter-spacing:.01em}
.ph p{margin:2px 0 0;color:var(--muted)}
.ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);text-decoration:none;display:inline-flex;gap:4px;margin-bottom:4px}
.crumb:hover{color:var(--text)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;font-size:13px;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.xs{padding:3px 7px;font-size:11px;border-radius:6px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn.icon.sm{width:28px;height:28px;padding:5px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.kbd{font:11px/1 ui-monospace,Consolas,monospace;padding:3px 5px;border-radius:5px;border:1px solid var(--line2);color:var(--faint);background:var(--panel)}

.input,select.input,textarea.input{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.input{min-height:110px;resize:vertical}
.input.sm{padding:5px 8px;font-size:13px;border-radius:7px}
.input.num{width:64px;text-align:center}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.req{color:var(--danger);font-size:10px;font-weight:700}
.hint{font-size:12px;color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fgrid .span2{grid-column:span 2}
.fgrid .full{grid-column:1/-1}
@media (max-width:600px){.fgrid .span2{grid-column:1/-1}}

.toggle{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(18px)}
.toggle-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg.accent button.on{background:var(--accent);color:var(--accent-ink)}

.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.choice button{text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.choice button b{display:block;font-size:13px}
.choice button small{color:var(--muted);font-size:11.5px}
.choice button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2));box-shadow:inset 0 0 0 1px var(--accent)}

.tabs{scrollbar-width:none;display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button,.tabs a{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tabs .on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:11px;background:var(--panel3);padding:1px 6px;border-radius:99px;margin-left:5px;color:var(--muted)}

/* ---------- cards / lists ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none;font-weight:500}
.card h3 .more:hover{color:var(--text)}
.grid{display:grid;gap:14px}
.grid>*,.stack>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .v{font-size:21px}}
.stack{display:flex;flex-direction:column;gap:14px}
.sep{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stat{padding:14px 16px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit;min-width:0}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12px;color:var(--muted)}

table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;font-weight:700;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);cursor:default}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--text)}
.tbl th.sorted{color:var(--accent)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--panel2)}
.tbl .num{text-align:right}
.tbl tr.me td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tbl-wrap{overflow:auto}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel3);color:var(--muted);white-space:nowrap}
.chip.green{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.chip.red{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss)}
.chip.blue{background:color-mix(in srgb,var(--blue) 18%,transparent);color:#60a5fa}
.chip.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}
.pos{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 5px;border-radius:5px;font-size:10.5px;font-weight:800;color:#fff}
.pos.GK{background:#d97706}.pos.DF{background:#2563eb}.pos.MF{background:#16a34a}.pos.FW{background:#dc2626}

.av{width:36px;height:36px;border-radius:50%;background:var(--panel3);object-fit:cover;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);overflow:hidden}
.av.sq{border-radius:8px;object-fit:contain;background:transparent}
.av.lg{width:64px;height:64px}
.av.sm{width:24px;height:24px;font-size:10px}
.crest{width:22px;height:22px;object-fit:contain;flex:none;display:inline-grid;place-items:center;border-radius:6px;font-size:10px;font-weight:800;background:var(--panel3);color:var(--muted);vertical-align:middle;overflow:hidden}
.crest.lg{width:56px;height:56px;font-size:18px;border-radius:12px}
.crest.md{width:32px;height:32px;font-size:12px}
img.crest{background:transparent}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick a{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-decoration:none;transition:border-color .12s,transform .12s}
.quick a:hover{border-color:var(--accent);transform:translateY(-1px)}
.quick a svg{width:22px;height:22px;color:var(--accent)}
.quick a b{font-size:13px}
.quick a small{color:var(--muted);font-size:11.5px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,7,18,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fade .12s}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:90vh;animation:pop .14s}
.modal.wide{max-width:820px}
.modal.xwide{max-width:1100px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:16px;flex:1}
.modal-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-end;align-items:center}
.modal-f .grow{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}


/* image drop */
.imgdrop{display:flex;align-items:center;gap:12px;padding:10px;border:1.5px dashed var(--line2);border-radius:12px;background:var(--panel2);cursor:pointer}
.imgdrop.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel2))}
.imgdrop .prev{width:64px;height:64px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--faint)}
.imgdrop .prev img{width:100%;height:100%;object-fit:contain}
.imgdrop .prev.wide{width:120px}

/* toast */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:11px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;box-shadow:var(--shadow);font-size:13px;animation:pop .15s}
.toast.err{border-color:var(--danger)}
.toast button{background:transparent;border:0;color:#4ade80;font-weight:700;cursor:pointer}

/* palette */
.pal{max-width:620px}
.pal input{border:0;background:transparent;font-size:16px;padding:16px 18px;outline:none;width:100%;border-bottom:1px solid var(--line)}
.pal .items{max-height:55vh;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer}
.pal .it.on{background:var(--panel3)}
.pal .it small{margin-left:auto;color:var(--faint);font-size:11px}
.pal .grp{font-size:11px;color:var(--faint);padding:8px 12px 2px;font-weight:700}

/* popover menu */
.pop{position:fixed;z-index:150;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-height:340px;overflow:auto;animation:pop .1s}
.pop .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.pop .it:hover,.pop .it.on{background:var(--panel3)}
.pop input{margin-bottom:6px}

/* ---------- match editor ---------- */
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:20px}
.scorebox .team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.scorebox .team b{font-size:15px}
.scorebox .sc{display:flex;align-items:center;gap:10px}
.scorebox .sc .n{font-size:44px;font-weight:900;min-width:48px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.stepper{display:flex;flex-direction:column;gap:4px}
.stepper button{width:28px;height:24px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;line-height:1;color:var(--muted)}
.stepper button:hover{color:var(--text);background:var(--panel3)}
@media (max-width:640px){.scorebox{padding:14px 8px;gap:6px}.scorebox .sc .n{font-size:32px;min-width:30px}}

.lineup-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.lineup-wrap{grid-template-columns:1fr}}
.pitch{position:relative;aspect-ratio:68/88;border-radius:14px;overflow:hidden;background:
  repeating-linear-gradient(0deg,#1d6b3a 0 9%,#1a6235 9% 18%);border:2px solid #2c8a4e;max-height:640px;margin:0 auto;width:100%}
.pitch::before{content:"";position:absolute;inset:4%;border:2px solid rgba(255,255,255,.35);border-radius:4px}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.35)}
.pitch .half{left:4%;right:4%;top:50%;height:0;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:22%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box1{left:25%;right:25%;bottom:4%;height:15%;border-bottom:0}
.pitch .box2{left:25%;right:25%;top:4%;height:15%;border-top:0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:84px;z-index:2}
.slot .dot{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;overflow:hidden;transition:transform .1s}
.slot.filled .dot{border:2px solid #fff;background:var(--kit,#c8102e)}
.slot .dot img{width:100%;height:100%;object-fit:cover}

const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('footchron-local', 1);
      r.onupgradeneeded = () => { const d = r.result; ['kv', 'img', 'cache'].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {

      const t = this.db.transaction(store, mode), s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out?.result ?? out);

    });
  },
  get(store, key) { return new Promise((res, rej) => { const r = this.db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(store, key, val) { return this.tx(store, 'readwrite', s => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  all(store) {
    return new Promise((res, rej) => {
      const out = {}, r = this.db.transaction(store).objectStore(store).openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      r.onerror = () => rej(r.error);
    });
  },
};

    this.wire(form, applyShow); applyShow();

      for (const el of $$('[data-img]', form)) { const k = el.dataset.img, x = getPath(v, k); if (x && x.startsWith('data:')) setPath(v, k, await Store.putImage(x)); }
      const r = await onSave(v, m); if (r !== false) m.close();

    form.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && !e.isComposing) { e.preventDefault(); save(); } });

const coerce = v => v === 'true' ? true : v === 'false' ? false : /^-?\d+(\.\d+)?$/.test(v) ? Number(v) : v;

function wireImage(el) {
  const file = $('input[type=file]', el);
  const set = val => { el.dataset.val = val; $('.prev', el).innerHTML = val ? `<img src="${esc(src(val))}">` : ic('upload'); };
  const take = async f => { if (!f || !f.type.startsWith('image/')) return; set(await fileToDataURL(f, el.closest('[data-fk]')?.dataset.fk?.match(/photo|image|stadium/) ? 900 : 512)); };
  el.addEventListener('click', async e => {
    if (e.target.closest('[data-imgurl]')) { e.stopPropagation(); const u = await UI.prompt('画像URL', el.dataset.val.startsWith('http') ? el.dataset.val : '', { ph: 'https://...' }); if (u != null) set(u); return; }
    if (e.target.closest('[data-imgclr]')) { e.stopPropagation(); set(''); return; }
    file.click();
  });
  file.onchange = () => take(file.files[0]);
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag'); take(e.dataTransfer.files[0]); });
  el.addEventListener('paste', e => { const f = [...e.clipboardData.files][0]; if (f) { e.preventDefault(); take(f); } });
}

/* ===== external APIs: API-Football (teams / crests / squads / photos) and Claude (AI article, screenshot reading) ===== */
const AF = {
  base: 'https://v3.football.api-sports.io',
  TTL: 7 * 864e5,
  key() { return (DB.settings.apiFootballKey || '').trim(); },
  // api-sports.io dashboard keys are 32 hex chars; longer keys come from RapidAPI and need its host + headers
  rapid() { return this.key().length > 40; },
  /** raw request; returns parsed JSON. API-Football answers bad/missing keys with a 403 that has no CORS header,
   *  so the browser only reports "Failed to fetch" — translate that into something actionable. */
  async raw(path, qs) {
    const url = this.rapid() ? `https://api-football-v1.p.rapidapi.com/v3${path}${qs}` : `${this.base}${path}${qs}`;
    const headers = this.rapid() ? { 'x-rapidapi-key': this.key(), 'x-rapidapi-host': 'api-football-v1.p.rapidapi.com' } : { 'x-apisports-key': this.key() };
    let r;
    try { r = await fetch(url, { headers }); }
    catch { throw new Error('API-Footballに接続できません。APIキーが正しいか（コピー時の空白・欠け）を確認してください。オフラインの可能性もあります'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.errors) throw new Error(r.status === 403 && this.rapid() ? 'RapidAPIでAPI-Footballを購読していないか、キーが無効です' : `API-Football: HTTP ${r.status}`);
    const errs = j.errors && (Array.isArray(j.errors) ? j.errors : Object.values(j.errors));
    if (errs && errs.length) throw new Error('API-Football: ' + errs.join(' / ').replace('Invalid API key, please check your request and credentials.', 'APIキーが正しくありません').replace(/(Error\/)?Missing application key.*/,'APIキーが正しくありません（dashboard.api-football.com の My Access にあるキーを貼ってください）').replace(/You have reached the request limit for the day.*/, '今日のリクエスト上限（無料100回）に達しました。明日また使えます'));
    return j;
  },
  async get(path, params = {}, { fresh = false } = {}) {
    if (!this.key()) { UI.toast('設定でAPI-FootballのAPIキーを入力してください', { err: true }); go('/settings'); throw new Error('APIキーが未設定です'); }
    const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)).toString();
    const ck = `${this.base}${path}${qs ? '?' + qs : ''}`;
    if (!fresh) { const c = await IDB.get('cache', ck); if (c && Date.now() - c.t < this.TTL) return c.data; }
    const j = await this.raw(path, qs ? '?' + qs : '');
    await IDB.put('cache', ck, { t: Date.now(), data: j.response });
    DB.settings.afUsed = (DB.settings.afUsedDay === today() ? DB.settings.afUsed || 0 : 0) + 1; DB.settings.afUsedDay = today(); Store.save();
    return j.response;
  },
  pos: p => ({ Goalkeeper: 'GK', Defender: 'DF', Midfielder: 'MF', Attacker: 'FW', G: 'GK', D: 'DF', M: 'MF', F: 'FW' }[p] || 'MF'),
  searchTeams: q => AF.get('/teams', { search: q }),
  leagueTeams: (league, season) => AF.get('/teams', { league, season }),
  searchLeagues: q => AF.get('/leagues', { search: q }),
  squad: team => AF.get('/players/squads', { team }),
  async teamPlayers(team, season) {
    const out = []; let page = 1, total = 1;
    while (page <= total && page <= 5) {
      const r = await this.raw('/players', `?team=${team}&season=${season}&page=${page}`);
      out.push(...r.response); total = r.paging?.total || 1; page++;
    }
    return out;
  },
};

/* ===== AI: Google Gemini (free tier) or Claude, called directly from the browser with the user's own key =====
 * content parts: { text } | { image: { mime, data(base64) } } */
const AI = {
  provider() { const s = DB.settings; return s.aiProvider || (s.geminiKey ? 'gemini' : s.anthropicKey ? 'claude' : 'gemini'); },
  ready() { return this.provider() === 'gemini' ? !!DB.settings.geminiKey : !!DB.settings.anthropicKey; },
  need() { if (this.ready()) return; UI.toast('AIを使うには設定でGemini（無料）かClaudeのAPIキーを入力してください', { err: true, ms: 5000 }); go('/settings'); throw new Error('AIキーが未設定です'); },
  async call(content, { system, maxTokens = 8000, json = false } = {}) {
    this.need();
    const parts = typeof content === 'string' ? [{ text: content }] : content;
    return this.provider() === 'gemini' ? this.gemini(parts, { system, maxTokens, json }) : this.claude(parts, { system, maxTokens });
  },
  async gemini(parts, { system, maxTokens, json }) {
    const model = DB.settings.geminiModel || 'gemini-2.5-flash';
    const body = { contents: [{ role: 'user', parts: parts.map(p => p.image ? { inline_data: { mime_type: p.image.mime, data: p.image.data } } : { text: p.text }) }], generationConfig: { maxOutputTokens: maxTokens, ...(json ? { responseMimeType: 'application/json' } : {}) } };
    if (system) body.systemInstruction = { parts: [{ text: system }] };
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': DB.settings.geminiKey.trim() }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = j.error?.message || `HTTP ${r.status}`;
      throw new Error(/API key not valid/i.test(msg) ? 'Gemini APIキーが正しくありません' : r.status === 429 ? '無料枠の上限に達しました。少し時間をおくか、明日また試してください' : r.status === 404 ? `Geminiのモデル「${model}」が見つかりません。設定でモデル名を確認してください` : 'Gemini: ' + msg);
    }
    const c = j.candidates?.[0];
    if (!c) throw new Error('AIが応答しませんでした' + (j.promptFeedback?.blockReason ? `（${j.promptFeedback.blockReason}）` : ''));
    return (c.content?.parts || []).map(p => p.text || '').join('');
  },
  async claude(parts, { system, maxTokens }) {
    const model = DB.settings.model || 'claude-opus-5';
    const content = parts.map(p => p.image ? { type: 'image', source: { type: 'base64', media_type: p.image.mime, data: p.image.data } } : { type: 'text', text: p.text });
    const body = { model, max_tokens: maxTokens, messages: [{ role: 'user', content }], output_config: { effort: 'medium' } };
    if (system) body.system = system;
    const headers = { 'content-type': 'application/json', 'x-api-key': DB.settings.anthropicKey.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
    if (/^claude-(opus-5$|fable-5-1)/.test(model)) { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(r.status === 401 ? 'Anthropic APIキーが正しくありません' : r.status === 402 || /credit/i.test(j.error?.message || '') ? 'Anthropicのクレジット残高が不足しています' : r.status === 429 ? 'AIの利用が混み合っています。少し待ってから再試行してください' : (j.error?.message || `HTTP ${r.status}`));
    if (j.stop_reason === 'refusal') throw new Error('AIが生成を辞退しました' + (j.stop_details?.explanation ? `: ${j.stop_details.explanation}` : ''));
    return j.content.filter(b => b.type === 'text').map(b => b.text).join('');
  },
  async img(file) { const d = await fileToDataURL(file, 1800, .9); const [meta, data] = d.split(','); return { image: { mime: meta.match(/data:(.*);/)[1], data } }; },
  /** ask for JSON about one or more screenshots */
  async readJSON(files, prompt) {
    const imgs = await Promise.all([...files].map(f => this.img(f)));
    const t = await this.call([...imgs, { text: prompt + '\n説明文は不要、JSONのみを返してください。' }], { maxTokens: 8000, json: true });
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0) throw new Error('読み取り結果を解釈できませんでした');
    return JSON.parse(t.slice(a, b + 1));
  },
  squadList(season) { return playersOf(season).map(p => `${p.number ?? ''} ${p.name}${p.sub ? ' / ' + p.sub : ''}`).join('\n'); },
  matchFacts(m) {

      evs.length ? 'イベント:\n' + evs.map(e => `- ${e.minute}' ${evText(e)}`).join('\n') : '',

      m.motm ? `MOM: ${pname(m.motm)}` : '', m.note ? `メモ: ${m.note}` : '',
      `直近成績: ${matchesFor({ season: m.season, done: true }).filter(x => x.date <= m.date).slice(-5).map(x => resultOf(x)).join('')}`,
      `クラブ: ${teamName(own())}${c.club.stadium ? ' / ホーム ' + c.club.stadium : ''}`,

  async article(m, { length = 600, memo = '' } = {}) {
    const sys = 'あなたはサッカークラブの公式サイト広報担当です。与えられた試合データだけを根拠に、日本語の試合レポート記事を書きます。データにない事実（負傷、天候、具体的なプレー描写の創作など）は書きません。';
    const prompt = `次の試合の公式レポートを${length}字程度で書いてください。\n1行目に記事タイトル（# は付けない）、2行目は空行、3行目以降に本文（Markdown可、見出しは##）。\n\n${this.matchFacts(m)}${memo ? `\n\n補足（必ず反映）: ${memo}` : ''}`;
    const t = await this.call(prompt, { system: sys });
    const [title, ...rest] = t.trim().split('\n');
    return { title: title.replace(/^#+\s*/, '').trim(), body: rest.join('\n').trim() };
  },

  readMatch(files, m) {
    return this.readJSON(files, `これらはサッカーゲーム「EA SPORTS FC」キャリアモードの試合後画面のスクリーンショットです（試合結果・タイムライン、スタッツ、選手評価のいずれか/複数）。
ホーム: ${teamName(m.homeId)} / アウェイ: ${teamName(m.awayId)}。自チームは ${teamName(own())}。
読み取れた情報だけを次の形のJSONで返してください。読み取れない項目は省略。
{"homeScore":数値,"awayScore":数値,"pk":{"home":数値,"away":数値}|null,
 "stats":{"possession":[ホーム,アウェイ],"shots":[..],"sot":[..],"xg":[..],"passes":[..],"passAcc":[..],"tackles":[..],"corners":[..],"fouls":[..],"offsides":[..],"saves":[..]},
 "events":[{"minute":数値,"type":"goal|pen|og|yellow|red|sub","side":"home|away","player":"名前","assist":"名前|null","in":"交代で入った選手|null","out":"交代で出た選手|null"}],

チーム名は次の登録名に近いものがあればその表記に合わせてください:\n${(comp.teamIds || []).map(teamName).join('\n')}`);
  },
  readSquad(files) {

ポテンシャルが「78-84」のような幅なら大きい方。選手名は次の登録リストに近いものがあればその表記に合わせてください:\n${this.squadList(curSeason())}`);

/* fuzzy name → id matching for AI results */
const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9぀-ヿ一-鿿]/g, '');
function matchPlayer(name, season) {
  if (!name) return null;
  const n = normName(name), ps = playersOf(season).length ? playersOf(season) : C().players;
  return (ps.find(p => normName(p.name) === n) || ps.find(p => normName(p.sub) === n)
    || ps.find(p => { const a = normName(p.name), last = normName(String(p.name).split(/\s+/).pop()); return (a.length > 2 && (a.includes(n) || n.includes(a))) || (last.length > 2 && n.includes(last)); }))?.id || null;
}
function matchTeam(name, ids) {
  const n = normName(name), ts = ids.map(teamById).filter(Boolean);
  return (ts.find(t => normName(t.name) === n) || ts.find(t => { const a = normName(t.name); return a.length > 2 && (a.includes(n) || n.includes(a)); }) || ts.find(t => normName(t.short) === n))?.id || null;
}

    $('.topbar').innerHTML = this.topbar(page.title);
    $('.tabbar').innerHTML = this.tabbar(p);

  },
  keys(e) {
    const typing = e.target.closest('input,textarea,select,[contenteditable]');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return Palette.open(); }
    if (e.key === 'Escape') { if ($('.pop')) return $('.pop').remove(); if (UI.closeTop()) return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); return e.shiftKey ? Store.doRedo() : Store.doUndo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); return Store.doRedo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); Store.flush(); return UI.toast('保存しました'); }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || UI.stack.length) return;
    if (e.key === '/') { const s = $('[data-search]'); if (s) { e.preventDefault(); s.focus(); } }
    if (e.key === 'n') { const b = $('[data-new]'); if (b) { e.preventDefault(); b.click(); } }
    if (e.key === 'M') go('/matches');

  click(e) {
    if (document.body.classList.contains('nav-open') && !e.target.closest('.sidebar,[data-act=menu]')) { document.body.classList.remove('nav-open'); e.preventDefault(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;

    if (el.dataset.actChange === 'season') {
      let v = el.value;
      if (v === '__other') { v = await UI.prompt('シーズンを指定', curSeason(), { ph: '2026/27' }); if (!v || !/^\d{4}\/\d{2}$/.test(v)) return this.render(); }

    }
    if (el.dataset.bind) Bind.apply(el);
  },
};
const Actions = {};

/* inline two-way binding: data-bind="matches:<id>:path" or "career::path" */
const Bind = {
  target(spec) {
    const [col, id] = spec.split(':');
    return col === 'career' ? C() : C()[col].find(x => x.id === id);
  },
  apply(el) {
    const [col, id, path] = el.dataset.bind.split(':');
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.type === 'num') v = v === '' ? '' : num(v);
    Store.commit('編集', () => { const t = Bind.target(`${col}:${id}`); if (t) setPath(t, path, v); }, { render: !!el.dataset.rerender });
    el.dataset.after && window[el.dataset.after]?.(el);
  },
};

      } : null,

      },

        $('[data-afsearch]', form).onclick = () => ApiImport.teamDialog(r => {

          apiId = r.team.id;

  async categories() {

    const m = UI.modal({ title: 'カテゴリ作成/管理', body: '<div data-list></div><div class="row nowrap"><input class="input" placeholder="新しいカテゴリ名（例: プレミアリーグ, 欧州カップ戦）" data-n><button class="btn primary" data-add>追加</button></div>' });

    });
  },
};

/* lineup interactions: click-to-place, drag & drop, swap */
function wireLineup(m, pane) {
  const lu = m.lineup;
  const place = (pid, slotKey) => Store.commit('ラインナップ', () => {
    const slots = formationSlots(lu.formation), slot = slots.find(s => s.key === slotKey);
    const from = lu.starters.find(s => s.pid === pid), target = lu.starters.find(s => s.key === slotKey);
    lu.bench = lu.bench.filter(x => x !== pid);
    if (from && target) { const t = target.pid; target.pid = pid; from.pid = t; }
    else if (from) { from.pid = null; lu.starters.push({ key: slotKey, label: slot.label, pid }); }
    else if (target) { if (target.pid) lu.bench.push(target.pid); target.pid = pid; }
    else lu.starters.push({ key: slotKey, label: slot.label, pid });
    lu.starters = lu.starters.filter(s => s.pid);
  });
  const toBench = pid => Store.commit('ベンチへ', () => { lu.starters = lu.starters.filter(s => s.pid !== pid); if (!lu.bench.includes(pid)) lu.bench.push(pid); });
  pane.addEventListener('click', e => {
    const sl = e.target.closest('[data-slot]'), pk = e.target.closest('[data-pick]');
    if (e.target.closest('button')) return;
    if (pk) { Matches.sel = Matches.sel?.pid === pk.dataset.pick ? null : { pid: pk.dataset.pick }; if (Matches.sel && Matches.sel.slot) Matches.sel = null; App.render(); return; }
    if (sl) {
      const key = sl.dataset.slot, cur = lu.starters.find(s => s.key === key);
      if (Matches.sel?.pid) { const pid = Matches.sel.pid; Matches.sel = null; return place(pid, key); }
      if (Matches.sel?.slot && Matches.sel.slot !== key) { const a = lu.starters.find(s => s.key === Matches.sel.slot); Matches.sel = null; if (a?.pid) return place(a.pid, key); }
      const items = [...(cur?.pid ? [{ label: 'このスロットを選択（クリックで入替）', value: '__sel' }, { label: 'ベンチへ下げる', value: '__bench' }, { label: '外す', value: '__rm' }, { group: '選手を選ぶ' }] : []),
        ...playersOf(m.season).map(p => ({ label: `${p.number ?? ''}  ${p.name}`, sub: p.pos + (lu.starters.some(s => s.pid === p.id) ? ' ・先発' : lu.bench.includes(p.id) ? ' ・ベンチ' : ''), value: p.id }))];
      UI.pick(sl, items, { search: true, onPick: it => {
        if (it.value === '__sel') { Matches.sel = { slot: key }; return App.render(); }
        if (it.value === '__bench') return toBench(cur.pid);
        if (it.value === '__rm') return Store.commit('外す', () => lu.starters = lu.starters.filter(s => s.key !== key));
        place(it.value, key);
      } });
    }
  });
  pane.addEventListener('dragstart', e => { const d = e.target.closest('[data-drag]'); if (d) { e.dataTransfer.setData('text/pid', d.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
  pane.addEventListener('dragover', e => { const t = e.target.closest('[data-slot],[data-bench]'); if (t) { e.preventDefault(); $$('.drop', pane).forEach(x => x !== t && x.classList.remove('drop')); t.classList.add('drop'); } });
  pane.addEventListener('dragleave', e => { const t = e.target.closest('[data-slot],[data-bench]'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop'); });
  pane.addEventListener('drop', e => {
    const pid = e.dataTransfer.getData('text/pid'); if (!pid) return; e.preventDefault();
    const sl = e.target.closest('[data-slot]'); if (sl) return place(pid, sl.dataset.slot);
    if (e.target.closest('[data-bench]')) toBench(pid);
  });
  pane.addEventListener('change', e => {
    if (e.target.dataset.actChange !== 'formation') return;
    const nf = e.target.value, ns = formationSlots(nf), old = formationSlots(lu.formation);
    Store.commit('フォーメーション変更', () => {
      const ordered = old.map(s => lu.starters.find(x => x.key === s.key)?.pid).filter(Boolean);
      lu.formation = nf; lu.starters = ordered.slice(0, ns.length).map((pid, i) => ({ key: ns[i].key, label: ns[i].label, pid }));
    });
  });
}

/* event form (inline) */
const EvForm = {
  open(m, type, ev) {
    const box = $('[data-evform]'); if (!box) return;
    const lu = m.lineup, opp = oppOf(m);
    const onPitch = [...lu.starters.map(s => s.pid), ...m.events.filter(e => e.type === 'sub' && e.inPid).map(e => e.inPid)].filter(Boolean);
    const ours = [...new Set([...onPitch, ...lu.bench])];
    const pool = (ours.length ? ours : playersOf(m.season).map(p => p.id)).map(id => playerById(id)).filter(Boolean);
    const sel = (k, list, v, empty = '選択') => `<select class="input sm" data-f="${k}">${opt('', empty, v)}${list.map(p => opt(p.id, `${p.number ?? ''} ${p.name}`, v)).join('')}</select>`;
    const e = ev || { minute: '', teamId: ['oppGoal'].includes(type) ? opp : own() };
    const side = `<div class="field"><label>チーム</label><div class="seg" data-side>${[[own(), teamName(own())], [opp, teamName(opp)]].map(([v, l]) => `<button type="button" data-v="${v}" class="${e.teamId === v ? 'on' : ''}">${esc(l)}</button>`).join('')}</div></div>`;
    const t = type === 'oppGoal' ? 'goal' : type;
    const isOurs = e.teamId === own();
    let fields = '';
    if (t === 'sub') fields = `<div class="field"><label>OUT</label>${isOurs ? sel('outPid', pool.filter(p => onPitch.includes(p.id)), e.outPid) : `<input class="input sm" data-f="outName" value="${esc(e.outName || '')}">`}</div><div class="field"><label>IN</label>${isOurs ? sel('inPid', pool.filter(p => lu.bench.includes(p.id) || !ours.length), e.inPid) : `<input class="input sm" data-f="inName" value="${esc(e.inName || '')}">`}</div>`;
    else if (['goal', 'pen', 'og', 'pkmiss', 'yellow', 'red'].includes(t)) fields = `<div class="field"><label>${t === 'og' ? 'オウンゴールした選手' : t === 'goal' || t === 'pen' ? '得点者' : '選手'}</label>${isOurs ? sel('pid', pool, e.pid) : `<input class="input sm" data-f="name" value="${esc(e.name || '')}" placeholder="名前（任意）">`}</div>${t === 'goal' ? `<div class="field"><label>アシスト</label>${isOurs ? sel('assistPid', pool, e.assistPid, 'なし') : `<input class="input sm" data-f="assistName" value="${esc(e.assistName || '')}" placeholder="任意">`}</div>` : ''}`;
    box.innerHTML = `<div class="evf ${t === 'goal' || t === 'sub' ? 'two' : 'one'}"><div class="field"><label>${EV[t].i} 分</label><input class="input sm" data-f="minute" inputmode="numeric" value="${esc(e.minute)}" placeholder="45"></div><div class="field"><label>+</label><input class="input sm" data-f="extra" inputmode="numeric" value="${esc(e.extra || '')}" placeholder=""></div>${fields}<div class="row nowrap acts" style="gap:6px"><button class="btn sm primary" data-evsave>${ev ? '更新' : '追加'}</button><button class="btn sm ghost" data-evx>×</button></div><div class="full" style="grid-column:1/-1">${['og', 'yellow', 'red', 'sub', 'pkmiss', 'goal', 'pen'].includes(type) && type !== 'oppGoal' ? side : ''}<span class="hint">Enterで${ev ? '更新' : '追加'}・続けて入力できます</span></div></div>`;
    const getSide = () => $('[data-side] .on', box)?.dataset.v || e.teamId;
    $('[data-side]', box)?.addEventListener('click', ev2 => { const b = ev2.target.closest('[data-v]'); if (!b) return; const ne = { ...collect(), teamId: b.dataset.v }; EvForm.open(m, type, { ...ne, id: e.id }); });
    const collect = () => { const o = { ...e, type: t, teamId: getSide() }; $$('[data-f]', box).forEach(i => o[i.dataset.f] = i.value.trim()); return o; };
    const save = () => {
      const o = collect();
      if (o.minute === '') { UI.toast('分を入力してください', { err: true }); $('[data-f=minute]', box).focus(); return; }
      o.minute = num(o.minute); o.extra = o.extra ? num(o.extra) : '';
      Store.commit(ev ? 'イベント編集' : `${EV[t].l}を記録`, () => {
        if (ev) Object.assign(m.events.find(x => x.id === ev.id), o);
        else { o.id = uid(); m.events.push(o); }
        if (t === 'sub' && o.teamId === own() && o.inPid) m.lineup.bench = m.lineup.bench.includes(o.inPid) ? m.lineup.bench : [...m.lineup.bench, o.inPid];
        const [h, a] = scoreFromEvents(m);
        if (['goal', 'pen', 'og'].includes(t)) { m.hs = Math.max(num(m.hs), h); m.as = Math.max(num(m.as), a); if (m.date <= today()) m.status = 'finished'; }
      });
      if (!ev) { Matches.pendingEv = { type }; App.render(); }
    };
    $('[data-evsave]', box).onclick = save; $('[data-evx]', box).onclick = () => box.innerHTML = '';
    box.addEventListener('keydown', k => { if (k.key === 'Enter' && !k.isComposing) { k.preventDefault(); save(); } if (k.key === 'Escape') { k.stopPropagation(); box.innerHTML = ''; } });
    const first = ev ? $('[data-f=minute]', box) : $('[data-f=minute]', box); first.focus(); first.select?.();
  },
};

});

function templateArticle(m) {
  const r = resultOf(m), [gf, ga] = gfga(m), opp = teamName(oppOf(m)), me = teamName(own()), home = m.homeId === own();
  const goals = (m.events || []).filter(e => ['goal', 'pen', 'og'].includes(e.type)).sort(by(e => num(e.minute)));
  const ours = goals.filter(e => (e.type !== 'og' && e.teamId === own()) || (e.type === 'og' && e.teamId !== own()));
  const verb = { W: `${gf}-${ga}で勝利`, D: `${gf}-${ga}で引き分け`, L: `${gf}-${ga}で敗戦` }[r] || '対戦';
  const title = `【${compLabel(m)}${roundLabel(m) ? ' ' + roundLabel(m) : ''}】${opp}戦は${verb}`;
  const body = [`${fmtDate(m.date, { wd: true })}、${compLabel(m)}${roundLabel(m) ? ' ' + roundLabel(m) : ''}で${home ? 'ホーム' : 'アウェイ'}に${opp}を${home ? '迎えた' : '訪れた'}${me}は、${verb}しました。`,
    ours.length ? `\n## 得点\n${ours.map(e => `- ${e.minute}' ${evName(e)}${e.type === 'pen' ? '（PK）' : e.type === 'og' ? '（OG）' : ''}${e.assistPid ? `（アシスト: ${pname(e.assistPid)}）` : ''}`).join('\n')}` : '',
    m.lineup?.formation ? `\n## スターティングメンバー（${m.lineup.formation}）\n${m.lineup.starters.filter(s => s.pid).map(s => `${playerById(s.pid)?.number ?? ''} ${pname(s.pid)}`).join(' / ')}` : '',
    m.motm ? `\nマン・オブ・ザ・マッチには${pname(m.motm)}が選ばれました。` : '', m.note ? `\n${m.note}` : ''].filter(Boolean).join('\n');
  return { title, body };
}

Object.assign(Actions, {
  setDesign: a => Store.commit('デザイン', c => c.design[a.dataset.k] = coerce(a.dataset.v)),
  pickColor: () => {
    const s = src(teamById(own())?.logo); if (!s) return UI.toast('エンブレムが未設定です');
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const cv = document.createElement('canvas'); cv.width = cv.height = 48; const x = cv.getContext('2d'); x.drawImage(img, 0, 0, 48, 48);
        const d = x.getImageData(0, 0, 48, 48).data, cnt = {};
        for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 200) continue; const [r, g, b] = [d[i], d[i + 1], d[i + 2]]; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); if (mx - mn < 40 || mx < 50) continue; const k = [r >> 5, g >> 5, b >> 5].join(); cnt[k] = (cnt[k] || 0) + 1; }
        const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; if (!top) return UI.toast('色を抽出できませんでした');
        const hex = '#' + top[0].split(',').map(v => (v * 32 + 16).toString(16).padStart(2, '0')).join('');
        Store.commit('アクセントカラー', c => c.design.accent = hex, { toast: `${hex} を設定しました` });
      } catch { UI.toast('この画像からは色を抽出できません（外部画像の制限）', { err: true }); }
    };
    img.src = s;
  },
});

function clubRecords() {
  const c = C(), ms = matchesFor({ done: true });
  const seasons = [...new Set(ms.map(m => m.season))].sort();
  const ps = playerStats({ ms });
  const allTime = k => Object.values(ps).filter(x => x[k] && playerById(x.pid)).sort(by(x => x[k], -1)).slice(0, 10);
  const perSeason = seasons.map(s => { const sm = ms.filter(m => m.season === s); const sp = playerStats({ ms: sm }); const r = teamRecord(sm); const ts = Object.values(sp).sort(by(x => x.g, -1))[0]; const ta = Object.values(sp).sort(by(x => x.a, -1))[0]; const lg = c.competitions.find(k => k.season === s && k.format === 'league' && k.teamIds?.includes(own())); return { s, r, ts, ta, rank: lg ? standings(lg).find(x => x.id === own())?.rank : null, league: lg?.name }; });
  const best = (f, d = -1) => ms.slice().sort(by(f, d))[0];
  const st = streaks(ms);
  const bigWin = best(m => { const [f, a] = gfga(m); return f - a; }), bigLoss = best(m => { const [f, a] = gfga(m); return a - f; }), most = best(m => gfga(m)[0]);
  const singleSeason = k => { let b = null; seasons.forEach(s => Object.values(playerStats({ ms: ms.filter(m => m.season === s) })).forEach(x => { if (!b || x[k] > b[k]) b = { ...x, season: s }; })); return b; };
  const tIn = c.transfers.filter(t => t.dir === 'in' && num(t.fee)).sort(by(t => num(t.fee), -1)).slice(0, 5);
  const tOut = c.transfers.filter(t => t.dir === 'out' && num(t.fee)).sort(by(t => num(t.fee), -1)).slice(0, 5);
  return { ms, seasons, allTime, perSeason, st, bigWin, bigLoss, most, singleSeason, tIn, tOut };
}

const sideOf = code => /^L/.test(code || '') ? 0 : /^R/.test(code || '') ? 2 : 1;

/* ---------- generic screenshot → AI → preview → apply dialog ---------- */
const ShotDialog = {
  open({ title, hint, read, preview, apply }) {
    const md = UI.modal({
      title, cls: 'wide',
      body: `<div class="notice">${hint}</div><div class="dropzone" data-dz>${ic('upload')} 画像を選択 / ドロップ / Ctrl+V で貼り付け（複数枚OK・スマホならカメラで撮影も可）<input type="file" accept="image/*" multiple hidden></div><div class="row" data-thumbs></div><div data-out></div>`,
      foot: `<span class="hint grow">${AI.provider() === 'gemini' ? 'Gemini（無料枠）' : 'Claude'}で読み取ります</span><button class="btn" data-read disabled>${ic('sparkle')}読み取る</button><button class="btn primary" data-apply disabled>反映する</button>`,
    });
    let files = [], res = null;
    const draw = () => { md.$('[data-thumbs]').innerHTML = files.map((f, i) => `<span style="position:relative;display:inline-block"><img src="${URL.createObjectURL(f)}" style="height:70px;border-radius:8px;display:block"><button class="btn xs" data-rm="${i}" style="position:absolute;top:3px;right:3px;min-height:0;padding:1px 6px">×</button></span>`).join(''); md.$('[data-read]').disabled = !files.length; };
    const add = fs => { files.push(...[...fs].filter(f => f.type.startsWith('image/'))); draw(); };
    const dz = md.$('[data-dz]'), fi = $('input', dz);
    dz.onclick = () => fi.click(); fi.onchange = () => { add(fi.files); fi.value = ''; };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); }; dz.ondragleave = () => dz.classList.remove('drag');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); add(e.dataTransfer.files); };
    md.el.addEventListener('paste', e => add(e.clipboardData.files));
    md.$('[data-thumbs]').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { files.splice(+b.dataset.rm, 1); draw(); } };
    md.$('[data-read]').onclick = async () => {
      const btn = md.$('[data-read]'); btn.disabled = true;
      md.$('[data-out]').innerHTML = `<div class="empty">${ic('sparkle')} 読み取り中…（10〜40秒）</div>`;
      try { res = await read(files); md.$('[data-out]').innerHTML = preview(res); md.$('[data-apply]').disabled = false; }
      catch (e) { md.$('[data-out]').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      btn.disabled = false;
    };
    md.$('[data-apply]').onclick = () => { const opt = Object.fromEntries($$('[data-o]', md.el).map(i => [i.dataset.o, i.checked])); if (apply(res, opt, md) !== false) md.close(); };
    if (!AI.ready()) setTimeout(() => md.$('[data-out]').innerHTML = `<div class="notice warn">AIのAPIキーが未設定です。<a href="#/settings">設定</a>で Gemini の無料キーを入れてください（Googleアカウントだけで無料）。</div>`);
  },
};

          if (o.stats) for (const [k, v] of Object.entries(r.stats || {})) if (Array.isArray(v)) m.stats[k] = v.map(x => x ?? '');

            const prev = matchesFor({}).filter(x => x.id !== m.id && x.lineup?.starters?.some(s => s.pid)).pop();
            const f = prev?.lineup.formation || m.lineup.formation || '4-3-3', slots = formationSlots(f);
            const rows = r.ratings.map(x => ({ id: pid(x.player), pos: x.position, sub: !!x.sub })).filter(x => x.id);
            const st = (rows.some(x => x.sub) ? rows.filter(x => !x.sub) : rows.slice(0, 11)).slice(0, 11);

            st.sort((a, b) => (order[posGroup(a.pos) || playerById(a.id).pos] - order[posGroup(b.pos) || playerById(b.id).pos]) || sideOf(a.pos) - sideOf(b.pos));
            m.lineup = { formation: f, starters: st.map((x, i) => slots[i] && { key: slots[i].key, label: slots[i].label, pid: x.id }).filter(Boolean), bench: rows.filter(x => !st.includes(x)).map(x => x.id) };
          }

            const ev = { id: uid(), type, minute: num(e.minute), teamId: tid };
            if (type === 'sub') { if (ours) { ev.inPid = pid(e.in) || ''; ev.outPid = pid(e.out) || ''; if (!ev.inPid) ev.inName = e.in || ''; if (!ev.outPid) ev.outName = e.out || ''; if (ev.inPid && !m.lineup.bench.includes(ev.inPid) && !m.lineup.starters.some(s => s.pid === ev.inPid)) m.lineup.bench.push(ev.inPid); } else { ev.inName = e.in || ''; ev.outName = e.out || ''; } }
            else if (ours) { ev.pid = pid(e.player) || ''; if (!ev.pid) ev.name = e.player || ''; ev.assistPid = pid(e.assist) || ''; if (!ev.assistPid && e.assist) ev.assistName = e.assist; }
            else { ev.name = e.player || ''; ev.assistName = e.assist || ''; }
            if (!m.events.some(x => x.type === ev.type && num(x.minute) === ev.minute && x.teamId === ev.teamId)) m.events.push(ev);
          }
          if (o.ratings) {
            for (const x of r.ratings || []) { const id = pid(x.player); if (id && x.rating != null) m.ratings[id] = num(x.rating); }
            const best = Object.entries(m.ratings).sort((a, b) => num(b[1]) - num(a[1]))[0];
            m.motm = pid(r.motm) || m.motm || best?.[0] || '';

/* ---------- OVR / POT ---------- */
const Ovr = {
  of(p, season = curSeason()) { return (p.ovrHist || []).filter(h => h.season === season).at(-1) || null; },
  prev(p, season = curSeason()) { return (p.ovrHist || []).filter(h => h.season < season).at(-1) || null; },
  first(p) { return (p.ovrHist || [])[0] || null; },
  set(p, season, k, v) {
    p.ovrHist = p.ovrHist || [];
    let h = p.ovrHist.find(x => x.season === season);
    if (!h) { h = { season, date: today(), ovr: '', pot: '' }; p.ovrHist.push(h); p.ovrHist.sort(by(x => x.season)); }
    h[k] = v === '' ? '' : num(v); h.date = today();
  },
  delta(p) { const a = this.of(p), b = this.prev(p); return a && b && a.ovr !== '' && b.ovr !== '' ? a.ovr - b.ovr : null; },
  chip(d) { return d == null ? '' : d > 0 ? `<span class="chip green">+${d}</span>` : d < 0 ? `<span class="chip red">${d}</span>` : '<span class="chip">±0</span>'; },
  chart(p) {
    const h = (p.ovrHist || []).filter(x => x.ovr !== ''); if (h.length < 2) return '';
    return Chart.line([{ data: h.map(x => x.ovr), color: 'var(--accent)' }, ...(h.some(x => x.pot) ? [{ data: h.map(x => x.pot || x.ovr), color: '#94a3b8' }] : [])], { labels: h.map(x => x.season), h: 160, min: Math.max(0, Math.min(...h.map(x => x.ovr)) - 5), max: Math.min(99, Math.max(...h.map(x => x.pot || x.ovr)) + 3) });
  },
  shot() {
    ShotDialog.open({
      title: '能力値をスクショから入力 (AI)',
      hint: 'FC27キャリアモードの<b>スカッド画面</b>（選手名・OVR・POTが見える一覧）を撮って入れてください。複数枚OK。今シーズン（' + esc(curSeason()) + '）の能力値として記録します。',
      read: files => AI.readSquad(files),
      preview: r => `<div class="card flush tbl-wrap"><table class="tbl"><thead><tr><th>読み取り</th><th>登録選手</th><th class="num">OVR</th><th class="num">POT</th><th class="num">年齢</th><th>Pos</th></tr></thead><tbody>${(r.players || []).map(x => { const id = matchPlayer(x.name, curSeason()); return `<tr><td>${esc(x.name)}</td><td>${id ? `<b>${esc(pname(id))}</b>` : '<span style="color:var(--warn)">新規 ⚠</span>'}</td><td class="num"><b>${esc(x.ovr ?? '')}</b></td><td class="num">${esc(x.pot ?? '')}</td><td class="num">${esc(x.age ?? '')}</td><td>${esc(x.pos ?? '')}</td></tr>`; }).join('')}</tbody></table></div><label class="row small" style="gap:6px;margin-top:8px"><input type="checkbox" data-o="addNew">一致しない選手を新規登録する（ユース昇格・新加入など）</label>`,
      apply: (r, o) => {
        let n = 0, a = 0;
        Store.commit('能力値読み取り', c => {
          for (const x of r.players || []) {
            let p = playerById(matchPlayer(x.name, curSeason()));
            if (!p && o.addNew) { p = { ...Players.blank(), id: uid(), name: x.name, number: x.number ?? '', pos: posGroup(x.pos) || 'MF', positions: { main: x.pos || '', subs: [] }, seasons: [curSeason()] }; if (x.age) p.birth = `${parseInt(curSeason()) - num(x.age)}-01-01`; c.players.push(p); a++; }
            if (!p) continue;
            if (x.ovr != null) Ovr.set(p, curSeason(), 'ovr', x.ovr); if (x.pot != null) Ovr.set(p, curSeason(), 'pot', x.pot); n++;
          }
        }, { toast: `${n}人の能力値を記録しました${a ? `（新規${a}人）` : ''}` });
      },
    });
  },
};

/* ---------- season transition ---------- */
const Season = {
  isOver(s = curSeason()) {
    const lg = C().competitions.filter(k => k.season === s && k.format !== 'cup' && (k.teamIds || []).includes(own()));
    const ms = matchesFor({ season: s, friendly: false });
    return lg.length > 0 && ms.length > 0 && ms.every(isDone);
  },
  next() {
    const c = C(), s = curSeason(), ns = seasonShift(s, 1), y = parseInt(ns);
    const ps = playersOf(s), comps = c.competitions.filter(k => k.season === s);
    const endY = parseInt(s) + 1, expiring = p => p.contract?.until && p.contract.until <= `${endY}-06`;
    UI.form({
      title: `${s} → ${ns} シーズンへ`, cls: 'wide', saveLabel: '新シーズンを始める',
      fields: [
        { type: 'html', html: `<div class="notice">選手の引き継ぎ・大会のコピー・日程生成をまとめて行います。今シーズンのデータはそのまま残ります（上部のシーズン切替でいつでも見られます）。${Season.isOver(s) ? '' : '<br><b>まだ終わっていない試合があります。</b>'}</div>` },
        { k: 'season', label: '新しいシーズン', type: 'select', opts: seasonsRange(1990, 2050) },
        { type: 'section', label: '① 引き継ぐ選手', hint: '退団・契約満了・放出した選手はチェックを外してください（<span style="color:var(--warn)">満了</span>＝契約が今季まで）' },
        { k: 'pids', type: 'checks', cls: 'full', filter: true, opts: ps.map(p => [p.id, `${p.number ?? ''} ${p.name}`, `<span class="pos ${p.pos}">${p.pos}</span>${expiring(p) ? '<span class="chip gold">満了</span>' : ''}`]) },
        { type: 'section', label: '② 次のシーズンにも出る大会' },
        { k: 'cids', type: 'checks', cls: 'full', opts: comps.map(k => [k.id, `${k.name}（${FORMATS[k.format]}・${(k.teamIds || []).length}チーム）`]) },
        { k: 'fixtures', label: 'リーグ戦の日程を自動生成する', type: 'toggle', hint: '昇格・降格でチームが入れ替わる場合は、あとで大会の参加チームを直してから日程を生成してもOK' },
        { k: 'start', label: '開幕日', type: 'date', show: v => v.fixtures },
      ],
      value: { season: ns, pids: ps.filter(p => !expiring(p)).map(p => p.id), cids: comps.map(k => k.id), fixtures: true, start: `${y}-08-15` },
      onSave: v => {
        let made = 0;
        Store.commit('新シーズン', c => {
          v.pids.forEach(id => { const p = playerById(id); if (!p.seasons.includes(v.season)) p.seasons.push(v.season); });
          for (const id of v.cids) {
            const k = compById(id), nk = { ...structuredClone(k), id: uid(), season: v.season, adjust: {} };
            c.competitions.push(nk);
            if (v.fixtures && k.format !== 'cup' && nk.teamIds.length > 1) { const ms = Comps.makeFixtures(nk, { start: v.start, interval: 7, time: '15:00', double: true, ownOnly: true }); c.matches.push(...ms); made += ms.length; }
          }

        });
        UI.toast(`${v.season} シーズン開始！${made ? `（${made}試合の日程を作成）` : ''}`, { ms: 5000 });
        go('/');
        setTimeout(() => UI.confirm('新シーズンの能力値（OVR/POT）を記録しますか？', { ok: '能力値ページへ', danger: false, sub: 'スカッド画面のスクショを入れるだけで成長を記録できます。' }).then(ok => ok && go('/players?tab=ovr')), 400);
      },

/* ---------- auto news (match reports + milestones) ---------- */
const AutoNews = {
  queue: [],
  cfg(c) { return c.autoNews = c.autoNews || { on: true, ai: false }; },
  /** called inside every Store.commit: create/refresh articles for newly finished matches */
  scan(c) {
    const cfg = this.cfg(c);
    if (!cfg.init) { c.matches.forEach(m => { if (isDone(m)) m.finishedAt = m.finishedAt || 1; }); cfg.init = true; return; }
    const fresh = c.matches.filter(m => isDone(m) && !m.finishedAt);
    fresh.forEach(m => m.finishedAt = Date.now());
    if (!cfg.on) return;
    for (const m of fresh.filter(isOwn).sort(by(m => m.date || ''))) this.forMatch(c, m);
    // keep untouched auto match reports in step with later edits (scorers added after the score, etc.)
    for (const n of c.news) {
      if (n.auto !== 'report' || n.edited) continue;
      const m = c.matches.find(x => x.id === n.matchId); if (!m || !isDone(m)) continue;
      const sig = this.sig(m); if (n.sig === sig) continue;
      const t = templateArticle(m); Object.assign(n, { title: t.title, body: t.body, sig, polished: false });
      if (cfg.ai) this.queue.push(n.id);
    }
    if (this.queue.length) setTimeout(() => this.flush(), 300);
  },
  sig: m => [m.hs, m.as, (m.events || []).length, m.motm, (m.lineup?.starters || []).length].join('|'),
  add(c, key, o) {
    if (c.news.some(n => n.autoKey === key)) return;
    const n = { id: uid(), mode: 'self', status: 'published', hero: false, image: '', label: 'お知らせ', date: today(), autoKey: key, ...o };
    c.news.unshift(n);
    if (this.cfg(c).ai && n.auto === 'report') this.queue.push(n.id);
  },
  forMatch(c, m) {
    const t = templateArticle(m);
    this.add(c, 'report:' + m.id, { auto: 'report', title: t.title, body: t.body, label: '試合結果', matchId: m.id, date: m.date || today(), sig: this.sig(m) });
    const all = matchesFor({ done: true }), i = all.findIndex(x => x.id === m.id);
    const before = playerStats({ ms: all.slice(0, i) }), after = playerStats({ ms: all.slice(0, i + 1) });
    const me = teamName(own()), d = m.date || today(), opp = teamName(oppOf(m));
    const goalsIn = pid => (m.events || []).filter(e => ['goal', 'pen'].includes(e.type) && e.pid === pid && e.teamId === own()).length;
    for (const pid of Object.keys(after)) {
      const p = playerById(pid); if (!p) continue;
      const b = before[pid] || { apps: 0, g: 0 }, a = after[pid];
      const g = goalsIn(pid);
      if (g >= 3) this.add(c, `hat:${m.id}:${pid}`, { auto: 'milestone', label: '試合結果', date: d, title: `${p.name}がハットトリック達成！`, body: `${fmtDate(d, { wd: true })}の${opp}戦で、${p.name}が${g}ゴールを挙げ${g === 3 ? 'ハットトリック' : `${g}得点の大活躍`}を達成しました。\n\n今季通算 ${playerStats({ season: m.season })[pid]?.g || g} ゴール。`, matchId: m.id });
      if (b.g === 0 && a.g > 0 && i > 0) this.add(c, `first:${pid}`, { auto: 'milestone', date: d, title: `${p.name}、${me}での初ゴール！`, body: `${opp}戦で${p.name}が${me}加入後初となるゴールを記録しました。`, matchId: m.id });
      for (const t of [50, 100, 150, 200, 250, 300, 400, 500]) if (b.apps < t && a.apps >= t) this.add(c, `apps:${pid}:${t}`, { auto: 'milestone', date: d, title: `${p.name}が公式戦通算${t}試合出場を達成`, body: `${opp}戦への出場で、${p.name}は${me}での通算出場数が${t}試合に到達しました。\n\n通算 ${a.g} ゴール ${a.a} アシスト。` });
      for (const t of [10, 25, 50, 75, 100, 150, 200, 300]) if (b.g < t && a.g >= t) this.add(c, `goals:${pid}:${t}`, { auto: 'milestone', date: d, title: `${p.name}が通算${t}ゴールに到達！`, body: `${opp}戦でのゴールにより、${p.name}は${me}での通算得点を${t}に伸ばしました（${a.apps}試合出場）。` });
    }
    const debut = Object.keys(after).filter(pid => !before[pid] && i > 0 && playerById(pid));
    if (debut.length && debut.length <= 5) this.add(c, `debut:${m.id}`, { auto: 'milestone', date: d, title: `${debut.map(pname).join('、')}がデビュー`, body: `${opp}戦で${debut.map(pname).join('、')}が${me}での公式戦デビューを飾りました。`, matchId: m.id });
    const res = all.slice(0, i + 1).map(x => resultOf(x));
    let w = 0, u = 0; for (let j = res.length - 1; j >= 0 && res[j] === 'W'; j--) w++; for (let j = res.length - 1; j >= 0 && res[j] !== 'L'; j--) u++;
    if (w >= 5 && w % 5 === 0) this.add(c, `win:${m.id}`, { auto: 'milestone', date: d, title: `${me}、公式戦${w}連勝！`, body: `${opp}戦の勝利で、公式戦${w}連勝となりました。` });
    else if (u >= 10 && u % 10 === 0 && resultOf(m) !== 'W') this.add(c, `unb:${m.id}`, { auto: 'milestone', date: d, title: `${me}、公式戦${u}試合無敗`, body: `${opp}戦で負けなしを${u}試合に伸ばしました。` });
    const [f, ag] = gfga(m), prevMax = Math.max(0, ...all.slice(0, i).map(x => { const [a1, b1] = gfga(x); return a1 - b1; }));
    if (i >= 5 && f - ag >= 4 && f - ag > prevMax) this.add(c, `bigwin:${m.id}`, { auto: 'milestone', date: d, title: `クラブ記録！${opp}に${f}-${ag}の大勝`, body: `${opp}戦の${f}-${ag}は、クラブ記録として残る史上最大得失点差での勝利となりました。` });
  },
  async flush() {
    const ids = [...new Set(this.queue)]; this.queue = [];
    if (!AI.ready()) return;
    for (const id of ids) {
      const n = C().news.find(x => x.id === id); if (!n || n.edited || n.polished) continue;
      try { const r = await AI.polish(n.title, n.body); Store.commit('AI記事', () => Object.assign(n, r, { polished: true }), { render: App.path() === '/news' }); }
      catch (e) { UI.toast('AI記事の作成に失敗: ' + e.message, { err: true }); break; }
    }
  },
};
