// Captured while this script runs, before the first render replaces <body>: lets the app re-publish itself.
const APP_PARTS = { head: document.head.outerHTML, admin: document.currentScript?.textContent || '' };
const appHTML = () => `<!doctype html>\n<html lang="ja">${APP_PARTS.head}<body><script id="js-core">${CORE_SRC}<\/script><script id="js-admin">${APP_PARTS.admin}<\/script><script>App.boot().catch(e => { document.body.innerHTML = '<pre style="padding:20px;color:#f87171">起動エラー: ' + (e && e.stack || e) + '</pre>'; });<\/script></body></html>`;
const b64utf8 = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64url = s => b64utf8(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));
const TOKEN_URL = 'https://github.com/settings/tokens/new?scopes=gist,public_repo&description=FootChron%20Local';

const Sync = {
  FILE: 'footchron-data.json', REPO: 'footchron',
  cfg: null, state: 'off', applying: false, timer: null, busy: false, err: '',
  on() { return !!(this.cfg?.token && this.cfg?.gistId); },
  async load() { this.cfg = (await IDB.get('kv', 'sync')) || null; this.state = this.on() ? (this.cfg.dirty ? 'dirty' : 'ok') : 'off'; },
  async saveCfg() { await IDB.put('kv', 'sync', this.cfg); },
  setState(s, err = '') { this.state = s; this.err = err; const el = $('.sync-st'); if (el) el.outerHTML = Sync.badge(); },
  badge() {
    if (!this.on()) return `<a class="sync-st off" href="#/settings" title="クラウド同期は未設定">${ic('cloud')}<span class="hide-sm">未同期</span></a>`;
    const t = { ok: ['同期済み', ''], dirty: ['未送信', 'warn'], busy: ['同期中…', 'warn'], err: ['同期エラー', 'err'] }[this.state] || ['', ''];
    return `<button class="sync-st ${t[1]}" data-act="syncNow" title="${esc(this.err || t[0] + (this.cfg.lastSync ? '（' + new Date(this.cfg.lastSync).toLocaleString('ja-JP') + '）' : ''))}">${ic('cloud')}<span class="hide-sm">${t[0]}</span></button>`;
  },
  async gh(path, opts = {}) {
    const r = await fetch('https://api.github.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + (opts.token || this.cfg.token), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (r.status === 204) return null;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(r.status === 401 ? 'GitHubのトークンが無効か期限切れです' : `GitHub: ${j.message || r.status}`); e.status = r.status; throw e; }
    if (opts.withHeaders) return { body: j, scopes: r.headers.get('x-oauth-scopes') || '' };
    return j;
  },
  /* ---------- setup ---------- */
  async setup(token) {
    const { body: user, scopes } = await this.gh('/user', { token, withHeaders: true });
    if (scopes && !scopes.includes('gist')) throw new Error('トークンに「gist」権限がありません。リンクから作り直してください');
    this.cfg = { token, login: user.login, gistId: '', repo: '', pagesUrl: '', lastRemote: '', lastSync: 0, dirty: false, siteAuto: true, lastSitePush: 0, canRepo: !scopes || /(^|, )(public_)?repo/.test(scopes) };
    const gists = await this.gh('/gists?per_page=100');
    const found = gists.find(g => g.files?.[this.FILE]);
    if (found) {
      this.cfg.gistId = found.id; await this.saveCfg();
      const hasLocal = C().players.length || C().matches.length;
      if (!hasLocal || await UI.confirm('クラウドに保存済みのデータがあります。読み込みますか？', { ok: '読み込む', danger: false, sub: 'この端末のデータはクラウドの内容に置き換わります。「キャンセル」でこの端末の内容をクラウドに上書きします。' })) await this.pull(true);
      else { this.cfg.dirty = true; this.cfg.lastRemote = found.updated_at; await this.push(true); }
    } else {
      const g = await this.gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'FootChron Local データ（自動同期・編集しないでください）', public: false, files: { [this.FILE]: { content: Store.exportJSON() } } }) });
      Object.assign(this.cfg, { gistId: g.id, lastRemote: g.updated_at, lastSync: Date.now() }); await this.saveCfg();
    }
    this.setState('ok');
    if (this.cfg.canRepo) { try { await this.deploy(); } catch (e) { UI.toast('アプリの公開に失敗: ' + e.message, { err: true, ms: 6000 }); } }
  },
  async applyLink(code) {
    const o = JSON.parse(unb64url(code));
    this.cfg = { token: o.t, login: o.l, gistId: o.g, repo: o.r || '', pagesUrl: o.u || '', lastRemote: '', lastSync: 0, dirty: false, siteAuto: true, lastSitePush: 0, canRepo: true };
    if (o.a) DB.settings.apiFootballKey = o.a;
    if (o.k) DB.settings.anthropicKey = o.k;
    if (o.m) { DB.settings.geminiKey = o.m; DB.settings.aiProvider = DB.settings.aiProvider || 'gemini'; }
    await this.saveCfg(); await this.pull(true);
    UI.toast('この端末の同期設定が完了しました');
  },
  phoneLink() {
    const code = b64url(JSON.stringify({ t: this.cfg.token, l: this.cfg.login, g: this.cfg.gistId, r: this.cfg.repo, u: this.cfg.pagesUrl, a: DB.settings.apiFootballKey || '', k: DB.settings.anthropicKey || '', m: DB.settings.geminiKey || '' }));
    return (this.cfg.pagesUrl || location.href.split('#')[0]) + '#sync=' + code;
  },
  /* ---------- data ---------- */
  async pull(force) {
    this.setState('busy');
    try {
      const g = await this.gh('/gists/' + this.cfg.gistId);
      if (!force && g.updated_at === this.cfg.lastRemote) { this.setState(this.cfg.dirty ? 'dirty' : 'ok'); return false; }
      const f = g.files[this.FILE]; if (!f) throw new Error('同期ファイルが見つかりません');
      const text = f.truncated ? await fetch(f.raw_url).then(r => r.text()) : f.content;
      await Store.applyRemote(text);
      Object.assign(this.cfg, { lastRemote: g.updated_at, lastSync: Date.now(), dirty: false }); await this.saveCfg();
      this.setState('ok'); return true;
    } catch (e) { this.setState('err', e.message); throw e; }
  },
  async push(skipCheck) {
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setState('busy');
    try {
      if (!skipCheck) {
        const g = await this.gh('/gists/' + this.cfg.gistId);
        if (this.cfg.lastRemote && g.updated_at !== this.cfg.lastRemote) { this.busy = false; return this.conflict(); }
      }
      const g = await this.gh('/gists/' + this.cfg.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [this.FILE]: { content: Store.exportJSON() } } }) });
      Object.assign(this.cfg, { lastRemote: g.updated_at, lastSync: Date.now(), dirty: false }); await this.saveCfg();
      this.setState('ok');
      if (this.cfg.siteAuto && this.cfg.repo && Date.now() - (this.cfg.lastSitePush || 0) > 10 * 60e3) this.publishSite().catch(() => {});
    } catch (e) { this.setState('err', e.message); }
    this.busy = false;
    if (this.again) { this.again = false; if (this.cfg.dirty) this.push(); }
  },
  async conflict() {
    this.setState('err', '別の端末で更新されています');
    const m = UI.modal({ title: '別の端末でデータが更新されています', body: '<p class="muted" style="margin:0">PCとスマホで同時に編集した可能性があります。どちらを残しますか？</p>', foot: '<button class="btn" data-mine>この端末の内容で上書き</button><button class="btn primary" data-theirs>クラウドの内容を読み込む</button>' });
    m.$('[data-theirs]').onclick = async () => { m.close(); await this.pull(true); UI.toast('クラウドの内容を読み込みました'); };
    m.$('[data-mine]').onclick = async () => { m.close(); await this.push(true); UI.toast('この端末の内容で上書きしました'); };
  },
  markDirty() {
    if (!this.on() || this.applying) return;
    if (!this.cfg.dirty) { this.cfg.dirty = true; this.saveCfg(); }
    this.setState('dirty');
    clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 4000);
  },
  async start() {
    if (!this.on()) return;
    const check = () => (this.cfg.dirty ? this.push() : this.pull(false).catch(() => {}));
    check();
    document.addEventListener('visibilitychange', () => { if (!this.on()) return; if (document.hidden) { if (this.cfg.dirty) { clearTimeout(this.timer); this.push(); } } else check(); });
  },
  /* ---------- GitHub Pages: app + public club site ---------- */
  async putFile(path, content, message) {
    const url = `/repos/${this.cfg.login}/${this.cfg.repo}/contents/${path}`;
    let sha; try { sha = (await this.gh(url)).sha; } catch (e) { if (e.status !== 404) throw e; }
    await this.gh(url, { method: 'PUT', body: JSON.stringify({ message, content: b64utf8(content), ...(sha ? { sha } : {}) }) });
  },
  async deploy() {
    const c = this.cfg; c.repo = c.repo || this.REPO;
    try { await this.gh(`/repos/${c.login}/${c.repo}`); }
    catch (e) { if (e.status !== 404) throw e; await this.gh('/user/repos', { method: 'POST', body: JSON.stringify({ name: c.repo, description: 'FootChron Local（自分用クラブ管理アプリ）', auto_init: true, has_issues: false, has_wiki: false }) }); await new Promise(r => setTimeout(r, 1500)); }
    await this.putFile('index.html', appHTML(), 'アプリを更新');
    await this.putFile('.nojekyll', '', 'Pages設定');
    await this.publishSite();
    try { await this.gh(`/repos/${c.login}/${c.repo}/pages`); }
    catch (e) {
      if (e.status !== 404) throw e;
      try { await this.gh(`/repos/${c.login}/${c.repo}/pages`, { method: 'POST', body: JSON.stringify({ source: { branch: 'main', path: '/' } }) }); }
      catch { c.pagesManual = true; }
    }
    c.pagesUrl = `https://${c.login.toLowerCase()}.github.io/${c.repo}/`; await this.saveCfg();
    App.render();
  },
  async publishSite() {
    await this.putFile('site/index.html', SiteExport.html(), 'クラブHPを更新');
    this.cfg.lastSitePush = Date.now(); await this.saveCfg();
  },
  async qr(text) {
    if (!window.qrcode) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const q = qrcode(0, 'L'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  },
  async showPhone() {
    const link = this.phoneLink();
    const m = UI.modal({ title: 'スマホで開く', body: `<div class="notice">スマホのカメラでQRを読み取るだけで、同期設定とAPIキーがスマホにも入ります。開いたらブラウザの共有メニューから「ホーム画面に追加」するとアプリのように使えます。</div>
      <div data-qr style="background:#fff;border-radius:12px;padding:10px;max-width:260px;margin:0 auto;width:100%">読み込み中…</div>
      ${this.cfg.pagesManual || !this.cfg.pagesUrl ? '<div class="notice warn">GitHub Pages がまだ有効になっていない可能性があります。下の「Pages設定を開く」で Branch を main にして Save してください（初回のみ）。</div>' : '<div class="hint center">公開直後は反映まで1〜2分かかることがあります。</div>'}
      <div class="row"><button class="btn sm" data-copy>${ic('copy')}リンクをコピー（LINE等で自分に送る用）</button>${this.cfg.repo ? `<a class="btn sm ghost" target="_blank" href="https://github.com/${esc(this.cfg.login)}/${esc(this.cfg.repo)}/settings/pages">Pages設定を開く</a>` : ''}</div>
      <div class="hint">このQR・リンクにはトークンが含まれます。他人に見せないでください。</div>` });
    m.$('[data-copy]').onclick = async () => { await navigator.clipboard.writeText(link); UI.toast('コピーしました'); };
    try { m.$('[data-qr]').innerHTML = await this.qr(link); } catch { m.$('[data-qr]').innerHTML = '<div class="small" style="color:#333;padding:20px">QRを表示できませんでした（オフライン？）。リンクのコピーを使ってください。</div>'; }
  },
  async disconnect() {
    if (!await UI.confirm('この端末のクラウド同期を解除しますか？', { ok: '解除', sub: 'データはこの端末とクラウドの両方に残ります。' })) return;
    this.cfg = null; await IDB.del('kv', 'sync'); this.setState('off'); App.render();
  },
};

/* settings card */
function syncCard() {
  const c = Sync.cfg;
  if (!Sync.on()) return `<div class="card stack" style="grid-column:1/-1;border-color:var(--accent)"><h3>${ic('cloud')}PCとスマホで同期・公開（GitHub）</h3>
    <div class="hint">GitHubの無料アカウントを使って、データの自動同期・アプリのスマホ公開・クラブHPの公開をまとめて設定します。</div>
    <ol class="small" style="margin:0;padding-left:20px;line-height:2">
      <li><a href="${TOKEN_URL}" target="_blank" rel="noopener" class="btn xs primary">GitHubでトークンを作成</a> を開く（GitHubにログイン）</li>
      <li>Expiration を <b>No expiration</b> にして、一番下の <b>Generate token</b> を押す（権限は選択済み）</li>
      <li>表示された <code>ghp_…</code> をコピーして下に貼り付け →「セットアップ」</li></ol>
    <div class="row nowrap"><input class="input" type="password" placeholder="ghp_..." data-ghtoken><button class="btn primary" data-act="syncSetup">セットアップ</button></div></div>`;
  return `<div class="card stack" style="grid-column:1/-1"><h3>${ic('cloud')}同期・公開（GitHub: ${esc(c.login)}）</h3>
    <div class="grid g3">
      <div><div class="lbl">データ同期</div><div style="margin:6px 0" class="row">${Sync.badge()}<b class="small">${({ ok: '同期済み', dirty: '未送信の変更あり', busy: '同期中…', err: 'エラー: ' + esc(Sync.err) })[Sync.state] || ''}</b></div><div class="hint">最終同期: ${c.lastSync ? new Date(c.lastSync).toLocaleString('ja-JP') : '—'}<br>編集すると数秒後に自動で送信、アプリを開くと自動で最新を読み込みます。</div></div>
      <div><div class="lbl">アプリ（スマホ用URL）</div>${c.pagesUrl ? `<a href="${esc(c.pagesUrl)}" target="_blank" class="small" style="word-break:break-all">${esc(c.pagesUrl)}</a>` : '<div class="hint">未公開</div>'}</div>
      <div><div class="lbl">クラブHP（公開ページ）</div>${c.pagesUrl ? `<a href="${esc(c.pagesUrl)}site/" target="_blank" class="small" style="word-break:break-all">${esc(c.pagesUrl)}site/</a><div class="hint">最終更新: ${c.lastSitePush ? new Date(c.lastSitePush).toLocaleString('ja-JP') : '—'}</div>` : '<div class="hint">未公開</div>'}</div>
    </div>
    <div class="row"><button class="btn primary" data-act="syncPhone">${ic('share')}スマホで開く（QR）</button><button class="btn" data-act="syncNow">今すぐ同期</button>${c.repo ? '<button class="btn" data-act="syncSite">HPを今すぐ更新</button><button class="btn ghost" data-act="syncDeploy">アプリを再公開</button>' : c.canRepo ? '<button class="btn" data-act="syncDeploy">アプリとHPを公開</button>' : ''}
      <label class="row small" style="gap:6px"><input type="checkbox" data-act-change="siteAuto" ${c.siteAuto ? 'checked' : ''}>HPを自動更新（最大10分に1回）</label><span class="grow"></span><button class="btn ghost danger" data-act="syncOff">同期を解除</button></div></div>`;
}
Object.assign(Actions, {
  syncSetup: async a => {
    const t = $('[data-ghtoken]').value.trim(); if (!t) return UI.toast('トークンを貼り付けてください', { err: true });
    a.disabled = true; a.textContent = '設定中…（1分ほど）';
    try { await Sync.setup(t); UI.toast('セットアップ完了！「スマホで開く」でQRを表示できます', { ms: 5000 }); App.render(); }
    catch (e) { UI.toast(e.message, { err: true, ms: 6000 }); a.disabled = false; a.textContent = 'セットアップ'; }
  },
  syncNow: async () => { try { if (Sync.cfg.dirty) await Sync.push(); else if (await Sync.pull(false)) UI.toast('最新のデータを読み込みました'); else UI.toast('最新の状態です'); } catch (e) { UI.toast(e.message, { err: true }); } },
  syncPhone: () => Sync.showPhone(),
  syncSite: async () => { try { await Sync.publishSite(); UI.toast('クラブHPを更新しました（反映まで1分ほど）'); App.render(); } catch (e) { UI.toast(e.message, { err: true }); } },
  syncDeploy: async a => { a.disabled = true; try { await Sync.deploy(); UI.toast('公開しました（反映まで1〜2分）'); } catch (e) { UI.toast(e.message, { err: true }); a.disabled = false; } },
  syncOff: () => Sync.disconnect(),
});
document.addEventListener('change', e => { if (e.target.dataset.actChange === 'siteAuto') { Sync.cfg.siteAuto = e.target.checked; Sync.saveCfg(); } });
</script><script>App.boot().catch(e => { document.body.innerHTML = '<pre style="padding:20px;color:#f87171">起動エラー: ' + (e && e.stack || e) + '</pre>'; });</script></body></html>
